<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="styles/rock-paper-scissors.css">
</head>
<body>

  <p class="title">Rock Paper Scissors</p>

  <button class="move-button js-rock-button">
    <img class="move-icon" src="emoji-images/rock-emoji.png" alt="Rock">
  </button>

  <button class="move-button js-paper-button">
    <img class="move-icon" src="emoji-images/paper-emoji.png" alt="Paper">
  </button>

  <button class="move-button js-scissors-button">
    <img class="move-icon" src="emoji-images/scissors-emoji.png" alt="Scissors">
  </button>

  <p class="js-result result"></p>

  <p class="js-moves"></p>

  <p class="js-score score"></p>

  <button class="reset-score-button js-reset-button">
    Reset Score
  </button>

  <button class="auto-play-button js-aut-play">Auto Play</button>

  <script src="script/rock-paper-scissors.js"></script>
</body>
</html>
