<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calc - Advanced Functions</title>
</head>
<body>
  <button class="js-start-button" onclick="
    changeButton();
  ">Start</button>

  <button class="js-add-to-cart" onclick="
    addToCart();
  ">Add to cart</button>
  <p class="js-added"></p>
  
  <script>
    // 12a
    let add = function function1() {
      console.log(2 + 3);
    }
    add();
    add();

    // 12b
    function runTwice(fun) {
      fun();
      fun();
    }

    runTwice(function() {
        console.log('12b');
      })
    runTwice(add);


    // c
    const StartButton = document.querySelector('.js-start-button');

    function changeButton() {
      setTimeout(function () {
        if (StartButton.innerHTML === 'Start') {
          StartButton.innerHTML = 'Finished!'
        } else {
          StartButton.innerHTML = 'Start'
        }
      }, 1000)
      }

    // 12d - 12c being modified
    const StartButton1 = document.querySelector('.js-start-button');

    function changeButton() {
        StartButton1.innerHTML = 'Loading...'

        setTimeout(function () { 
          StartButton1.innerHTML = 'Finished'
      }, 1000)
      }

      // 12e
      const cart = document.querySelector('.js-add-to-cart');
      const changeCart = document.querySelector('.js-added');

      function addToCart () {
        changeCart.innerHTML = 'Added';

        setTimeout(function () {
          changeCart.innerHTML = '';
        }, 1000, 1500)
      }

      // 12f
      let timeoutId;

      function addToCart() {
        changeCart.innerHTML = 'Added';

        // 1. clear the previous timeout if it is still running
        clearTimeout(timeoutId);

        // 2. Start a new timeout and save its ID to the variable
        timeoutId = setTimeout(function () {
          changeCart.innerHTML = '';
        }, 2000)
      }

  </script>
</body>
</html>
