<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <style>

    body {
      background-color: #1e1e2f;
    }

    p { 
      margin: 0;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background-color: #2b2b3c;
      width: 250px;
      height: 440px;
      margin: 50px auto;
      border: 1px solid rgb(74, 66, 66);
      border-radius: 10px;
    }

    .calc {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 4px;
      text-align: center;
    }

    button {
      font-size: 25px;
      border-radius: 5px;
      padding: 10px;
    }

    .operator {
      background-color: #ff9f0a;
      color: white;
    }

    textarea {
      padding: 20px;
      margin-top: 25px;
      border: 1px solid black;
      border-radius: 5px;
    }

    .bottom {
      background-color: white;
      color: black;
      padding: 5px;
    }

  
  </style>
</head>
<body>
  <div class="main-container">
    <textarea  name="calc" id="calc"></textarea>
    <p class="calc">
      <button onclick="
        calculation += '1';
        console.log(calculation);
        ">1</button>

      <button onclick="
      calculation += '2';
      console.log(calculation);
      ">2</button>

      <button onclick="
      calculation += '3';
      console.log(calculation);
      ">3</button>

      <button class="operator" onclick="
      calculation += ' + ';
      console.log(calculation);
      ">+</button>
    </p>

    <p class="calc">
      <button onclick="
        calculation += '4';
        console.log(calculation);
      ">4</button>

      <button onclick="
        calculation += '5';
        console.log(calculation);
      ">5</button>

      <button onclick="
        calculation += '6';
        console.log(calculation);
      ">6</button>

      <button class="operator" onclick="
      calculation += ' - ';
      console.log(calculation);
      ">-</button>
    </p>

    <p class="calc">
      <button onclick="
        calculation += '7';
        console.log(calculation);
        ">7</button>

      <button onclick="
        calculation += '8';
        console.log(calculation);
      ">8</button>

      <button onclick="
        calculation += '9';
        console.log(calculation);
      ">9</button>

      <button class="operator" onclick="
        calculation += ' * '
        console.log(calculation);
      ">*</button>
    </p>

    <p class="calc">
      <button onclick="
        calculation += '0';
        console.log(calculation);
        ">0</button>

      <button onclick="
        calculation += '.'
        console.log(calculation);
      ">.</button>

      <button class="operator" onclick="
        calculation = eval(calculation);
        console.log(calculation);
      ">=</button>

      <button class="operator" onclick="
        calculation += ' / ';
        console.log(calculation);
      ">/</button>
    </p>

    <p class="calc">
      <button class="bottom" onclick="
        calculation = '';
        console.log(calculation);
        ">C</button>

        <button class="bottom" onclick="
         calculation = '';
         console.log(calculation);
        ">⌫</button>

      <button class="bottom" class="operator" onclick="
        calculation = ''
        console.log(calculation);
      ">Clear</button>
    </p>
  </div>

  <script>
    let calculation = '';
  </script>
</body>
</html>
