<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <script>

    const electricityBills = {
      customerName: 'John Doe',
      units: 400,

      calculateTotalBills(units) {
        let total = 0;

        if (units <= 100) {
          total = units * 1.5;
        } else if (units <= 200) {
          total = (100 * 1.5) + ((units - 100) * 2)
        } else {
          total = (100 * 1.5) + (100 * 2) + ((units - 200) * 3);
        }

        return total
      },

      calculateSurcharge(totalBills) {
        if (totalBills > 400) {
          return totalBills * 0.1
        } else {
          return 0;
        }
      },

      calculateDiscountAmount(totalBills, units) {
        if (units < 50) {
          return totalBills * 0.05;
        } else {
          return 0;
        }
      },

      calculateFinalBill(totalBills, surcharge, discountAmount) {
        return totalBills + surcharge - discountAmount;
      },

      getStatus(finalBill) {
        if (finalBill > 500) {
          return 'High usage';
        } else {
          return 'Normal usage';
        }
      }
    };

    let totalBills = electricityBills.calculateTotalBills(electricityBills.units);
    let surcharge = electricityBills.calculateSurcharge(totalBills);
    let discountAmount = electricityBills.calculateDiscountAmount(totalBills, electricityBills.units);
    let finalBill = electricityBills.calculateFinalBill(totalBills, surcharge, discountAmount);
    let status = electricityBills.getStatus(finalBill);

    console.log(`Customer name: ${electricityBills.customerName}`);
    console.log(`Total bill: ${totalBills}`);
    console.log(`Total surcharge: ${surcharge}`);
    console.log(`Total discount: ${discountAmount}`);
    console.log(`Final bill: ${finalBill}`);
    console.log(`Status: ${status}`);

  </script>
</body>
</html>
