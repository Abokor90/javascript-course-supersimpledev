    // AUTO BOXING
    console.log('hello'.length);  // .length counts the number of letter in word(s)
    console.log('hello'.toUpperCase());  // .toUpperCase is a method that will give the values in capital letters

    // OBJECTS AS REFERENCES
    const object1 = {
      message: 'hello'
    };

    const object2 = object1;
    object1.message = 'Good job';
    console.log(object1);
    console.log(object2);

    const object3 = {
      message: 'Good job!'
    }
    console.log(object3 === object1); // false
    console.log(object2 === object1);  // true
    console.log(object2 === object3);  // false

    const object4 = {
      message: 'Good job!',
      price: 799
    };
    // const message = object4.message;
    const { message, price } = object4;
    console.log(message);
    console.log(price);

    // SHORTHAND PROPERTY
    const object5 = {
      // message: message
      message,    // both will give us the same value and is called shorthand property
      // method: function function1() {
      //   console.log('method');
      // }
      method: function function1() {
        console.log('method');

        // shorthand

      }
    };
