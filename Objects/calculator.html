<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body {
      background-color: rgb(172, 137, 103);
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      place-items: center
    }

    .main-calculator {
      border: 2px solid rgb(233, 220, 220);
      border-radius: 8px;
      display: grid;
      justify-content: center;
      justify-items: center;
      align-content: center;
      gap: 5px;
      width: fit-content;
      padding: 40px 15px 10px 15px;
      background-color: rgb(64, 58, 58);
      align-items: center;
      /* margin-left: 500px; */
    }

    .numb-symbol button {
      width: 15vw;
      height: 15vh;
      max-width: 60px;
      max-height: 60px;
      font-size: 20px;
      font-weight: bold;
      margin-left: 5px;
      margin-right: 5px;
      border-radius: 50%;
      border: none;
    }

    .symbols {
      background-color: rgb(128, 29, 29);
      color: white;
    }

    textarea {
      width: 100%;
      height: 50px;
      font-size: 22px;
      text-align: right;
      resize: none;
      border-radius: 4px;
    }

    .clear-reset-backspace button {
      font-size: 20px;
      font-weight: bold;
      margin-left: 5px;
      margin-right: 5px;
      border-radius: 50%;
      border: none;
      background-color: #ffc078;
      color: black;
      width: 18vw;
      height: 15vw;
      max-width: 75px;
      max-height: 60px;
    }
    
  </style>

</head>
<body>
 <div class="main-calculator"> 
  <textarea name="message" id="message" readonly></textarea>
 <p class="numb-symbol">
  <button onclick="
    press('1')
    ">1</button>

  <button onclick="
   press('2')
  ">2</button>

  <button onclick="
   press('3')
  ">3</button>

  <button class="symbols" onclick="
   press('+')
  ">+</button>
  </p>

  <p class="numb-symbol">
    <button onclick="
     press('4')
    ">4</button>

    <button onclick="
     press('5')
    ">5</button>

    <button onclick="
     press('6')
    ">6</button>

    <button class="symbols" onclick="
     press('-')
   ">-</button>
  </p>

  <p class="numb-symbol">
    <button onclick="
      press('7')
    ">7</button>

    <button onclick="
     press('8')
    ">8</button>

    <button onclick="
     press('9')
    ">9</button>

    <button class="symbols" onclick="
     press('*')
    ">*</button>
  </p>

  <p class="numb-symbol">
    <button onclick="
     press('0')
    ">0</button>

    <button onclick="
      press('.')
    ">.</button>

    <button class="symbols" onclick="
     equalSign();
    ">=</button>

  <button class="symbols" onclick="
    press('/')
  ">/</button>
  </p>

  <p class="clear-reset-backspace">
    <button class="" onclick="
      resetCalc();
    ">Reset</button>

    <button onclick="
      clearCalc();
    ">Clear</button>

    <button onclick="
      backspace();
    ">⌫</button>
  </p>
 </div>


  <script>
   let  calculation = localStorage.getItem('calculation') || '0';
  function updateDisplay() {
  document.getElementById('message').value = calculation;
  }


  function press(value) {
    if (calculation === '0') {
      calculation = value
    } else {
      calculation += value;
    }

    localStorage.setItem('calculation', calculation)

    updateDisplay();
  }

  function resetCalc() {
    calculation = '0';

    localStorage.setItem('calculation', calculation);

    updateDisplay();
  }

  function clearCalc() {
    calculation = '';

    localStorage.setItem('calculation', calculation);

    updateDisplay();
  }

  function backspace() {
    calculation = calculation.slice(0, -1);

    localStorage.setItem('calculation', calculation);

    updateDisplay();
  }

  function equalSign() {
    calculation = eval(calculation);

    localStorage.setItem('calculation', calculation);

    updateDisplay();
  }
  </script>
</body>
</html>
