<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Project</title>
</head>
<body>
  <p>Youtube Subscribe Button</p>
  <button  class="js-subscribe-button" onclick="
    Subscribe();
  ">
    Subscribe
  </button>

  <p>Amazon Shipping Calculator</p>
  <input  class="js-cost-input" type="text" placeholder="Cost of order" onkeydown="
   handleKeyDown(event);
  ">
  <button onclick="
    calculateTotal();
  ">Calculate</button>

  <p class="js-total-cost"></p>
  
  <script>
    String(25)
    console.log('25' - 5);
    console.log(25 + 5);

    window.document
    window.console.log('wwindow')
    window.alert

    function handleKeyDown (event) {
      if (event.key === 'Enter') {
        calculateTotal();
      }
    }

    function calculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');
      let cost = Number(inputElement.value);

      if (cost < 40) {
        cost = cost + 10;
      }

      document.querySelector('.js-total-cost').innerHTML = `$${cost.toFixed(2)}`
    }


    function Subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
      } else {
        buttonElement.innerHTML = 'Subscribe';
      }
    }
  </script>
</body>
</html>
