<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=
  , initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <input id="password" name="user-pasword" class="js-password-input" type="password" placeholder="Password input">
  <button class="js-show-password" onclick="
    showHidePassword();
  ">
   Show
  </button>

  <script>
    const passwordInput = document.querySelector('.js-password-input');

    const passwordStatus = document.querySelector('.js-show-password');

    function showHidePassword() {
      if (passwordStatus.innerText === 'Show') {

        passwordStatus.innerText = 'Hide';

        passwordInput.type = 'text';

      } else {

        passwordStatus.innerText = 'Show';

        passwordInput.type = 'password';
      }
    }
  </script>
</body>
</html>
