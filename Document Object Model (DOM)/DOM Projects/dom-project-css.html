<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Project</title>
  <style>
    body {
      font-family: arial;
    }

    .subscribe-button {
      border: none;
      background-color: black;
      color: white;
      /* padding: 10px; */
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 15px;
      padding-right: 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    /* .subscribe-button:hover {
      background-color: gray;
      color: black;
    } */

    .is-subscribed {
      background-color: rgb(240, 240, 240);
      color: black;
    }

    .cost-input {
      font-size: 15px;
      padding-top: 10px;
      padding: 10px;
    }

    .calculate-button {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      padding: 12px 15px;
      cursor: pointer;
    }

  
  </style>
</head>
<body>
  <p>Youtube Subscribe Button</p>
  <button  class="js-subscribe-button subscribe-button" onclick="
    Subscribe();
  ">
    Subscribe
  </button>

  <p>Amazon Shipping Calculator</p>
  <input  class="js-cost-input cost-input" type="text" placeholder="Cost of order" onkeydown="
   handleKeyDown(event);
  ">
  <button class="calculate-button" onclick="
    calculateTotal();
  ">Calculate</button>

  <p class="js-total-cost"></p>
  
  <script>
    String(25)
    console.log('25' - 5);
    console.log(25 + 5);

    window.document
    window.console.log('wwindow')
    window.alert

    function handleKeyDown (event) {
      if (event.key === 'Enter') {
        calculateTotal();
      }
    }

    function calculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');
      let cost = Number(inputElement.value);

      if (cost < 40) {
        cost = cost + 10;
      }

      document.querySelector('.js-total-cost').innerHTML = `$${cost}`
    }


    function Subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
      } else {
        buttonElement.innerHTML = 'Subscribe';
        buttonElement.classList.remove('is-subscribed');
      }
    }
  </script>
</body>
</html>
