    class ElectricityBill {
      constructor(customerName, units) {
        this.customerName =  customerName;
        this.units = units;

      }

      calculateTotalBill() {
        if (this.units <= 100) {
          return 1.5 * this.units;
        } else if (this.units <= 200) {
          return (100 * 1.5) + ((this.units - 100) * 2);
        } else {
          return (100 * 1.5) + (100 * 2) + ((this.units - 200) * 3);
        }
      }
    }

    const customer1 = new ElectricityBill('John Doe', 400);
    console.log(customer1.calculateTotalBill());
