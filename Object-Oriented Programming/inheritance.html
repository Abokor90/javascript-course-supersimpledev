    // Example 3
    class Vehicle {
      constructor(brand, speed){
        this.brand = brand;
        this.speed = speed;
      }

      displayInfo() {
        console.log('Brand new tuxedo car');
      }
    }

    class Car extends Vehicle {
      constructor(brand, speed, doors) {
        super(brand, speed);

        this.doors = doors;
      }

      displayInfo() {
        console.log('Brand new BMW car');
      }
    }

    const car = new Car('BMW', 250, 4);
    car.displayInfo();
