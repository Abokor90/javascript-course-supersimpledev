<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Quantity</title>
</head>
<body>
  <button onclick="
    console.log(`cart quantity: ${cartQuantity}`);
   ">Show Quantity</button>
  <button onclick="
    // cartQuantity += 1;
    cartQuantity++;

     if (cartQuantity > 10) {
      cartQuantity = 10;
      alert('The cart is full');
    }  

    console.log(`cart quantity: ${cartQuantity}`);
  ">Add to cart</button>

  <button onclick="
    cartQuantity += 2;

     if (cartQuantity > 10) {
      cartQuantity = 10;
      alert('The cart is full');
    }  

    console.log(`cart quantity: ${cartQuantity}`);
  ">+2</button>

  <button onclick="
    cartQuantity += 3;

     if (cartQuantity > 10) {
      cartQuantity = 10;
      alert('The cart is full');
    }  

    console.log(`Cart quantity: ${cartQuantity}`);
    ">+3</button>

    <button onclick="
     cartQuantity += 4;

      if (cartQuantity > 10) {
      cartQuantity = 10;
      alert('The cart is full');
    }  

      console.log(`Cart quantity: ${cartQuantity}`);
    ">+4</button>

    <button onclick="
     cartQuantity += 5;

      if (cartQuantity > 10) {
      cartQuantity = 10;
      alert('The cart is full');
    }  

     console.log(`Cart quantity: ${cartQuantity}`);
    ">+5</button>

    <button onclick="
     cartQuantity--;

     if (cartQuantity < 0) {
      cartQuantity = 0;
      alert('Not enough items in the cart')
     }
     console.log(`Cart quantity: ${cartQuantity}`);
    ">Remove from cart</button>

    <button onclick="
     cartQuantity -= 2;

     if (cartQuantity < 0) {
      cartQuantity = 0;
      alert('Not enough items in the cart')
     }

     console.log(`Cart quantity: ${cartQuantity}`);
    ">-2</button>

    <button onclick="
     cartQuantity -= 3;

     if (cartQuantity < 0) {
      cartQuantity = 0;
      alert('Not enough items in the cart')
     }

     console.log(`Cart quantity: ${cartQuantity}`); 
    ">-3</button>

  <button onclick="
    cartQuantity = 0;
    console.log('Cart was reset.');
    console.log(`Cart quantity: ${cartQuantity}`);

  <script>
    let cartQuantity = 0;
  </script>
